name: Next.js baseline

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "1 12 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextjs-baseline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Next.js baseline v1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned baseline and scheduled currency
        uses: JovaniPink/nextjs-typescript-boilerplate/baseline/v1@4c0caaa6b5d69cb261b255e04e2c739d8984ea66
        with:
          check-latest: ${{ github.event_name == 'schedule' }}
